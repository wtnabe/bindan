name: Ruby

on:
  push:
    branches:
      - main
      - "pull-req/**"

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: standard
        run: bundle exec rake standard
      - name: Unit tests (Docker-free)
        run: bundle exec rake spec
      - name: Pull emulator images
        run: docker compose pull
      - name: Start emulators (Storage, Firestore, Secret Manager)
        run: docker compose up --detach --wait --wait-timeout 60
      - name: Integration tests (Storage, Firestore, Secret Manager)
        run: bundle exec rake spec:integration
      - name: Emulator logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop emulators
        if: always()
        run: docker compose down --timeout 10
